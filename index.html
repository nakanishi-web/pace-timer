<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pace-timer-目的選択型フレキシブルタイマー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <h1>pace-timer</h1>
            <p class="subtitle">自分のペースで進めるタイマー</p>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- 目的・モード選択 -->
            <section class="selection-section">
                <label for="purpose-select">作業目的を選択</label>
                <select id="purpose-select">
                    <option value="coding">プログラミング・開発</option>
                    <option value="design">デザイン作成</option>
                    <option value="deskwork">事務・データ入力</option>
                    <option value="reading">読書・リサーチ</option>
                    <option value="study">学習</option>
                    <option value="other">その他</option>
                </select>
            </section>

            <!-- 目標時間設定 -->
            <section class="target-setting-section">
                <label for="target-minutes">目標時間(分)</label>
                <input type="number" id="target-minutes" value="25" min="1" max="180">
            </section>

            <!-- タイマー表示ディスプレイ -->
            <section class="timer-display-section">
                <div id="timer-display" class="timer-card">00:25:00</div>
                <div id="timer-status" class="status-message">待機中</div>
            </section>

            <!-- コントロールボタン -->
            <section class="controls-section">
                <button id="start-btn" class="btn primary-btn">スタート</button>
                <button id="pause-btn" class="btn secondary-btn" disabled>一時停止</button>
                <button id="reset-btn" class="btn danger-btn">リセット</button>
                <button id="finish-btn" class="btn success" disabled>終了・記録</button>
            </section>
        </main>

        <!-- 記録・ログ -->
        <aside class="log-section">
            <div class="log-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">作業ログ</h2>
                <button id="clear-all-btn" class="btn text-btn" style="font-size: 0.85rem; color: #ff5555; background: none; border: none; cursor: pointer; padding: 4px 8px;">全削除</button>
            </div>
            <ul id="log-list">
                <!-- ログがここに -->
            </ul>
        </aside>
    </div>

    <script src="main.js"></script>
</body>
</html>
